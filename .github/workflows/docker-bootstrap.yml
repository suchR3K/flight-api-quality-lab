name: Docker bootstrap tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: flight-bootstrap-ci
      POSTGRES_DB: flight_lab
      POSTGRES_USER: flight_app
      POSTGRES_PASSWORD: ci_bootstrap_password
      API_PORT: "8000"
      DB_PORT: "5432"
      SEED_DEMO: "true"

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start application with an empty database
        run: |
          mkdir -p reports
          docker compose up --build --wait --wait-timeout 180

      - name: Check initial data and migration history
        run: |
          docker compose exec -T api python - <<'PY'
          import json
          from pathlib import Path
          from database import get_connection

          with get_connection() as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT * FROM flights ORDER BY id")
                  flights = cursor.fetchall()

                  assert len(flights) == 25, (
                      f"Expected 25 demo flights, got {len(flights)}"
                  )
                  assert all(
                      row["flight_number"].startswith("DEMO")
                      for row in flights
                  )

                  cursor.execute(
                      "SELECT name, checksum, applied_at "
                      "FROM schema_migrations ORDER BY name"
                  )
                  migrations = cursor.fetchall()

                  assert [row["name"] for row in migrations] == [
                      "001_create_flights.sql",
                      "002_add_flight_details.sql",
                      "003_add_flight_unique_index.sql",
                  ]

          snapshot = json.dumps(
              {"flights": flights, "migrations": migrations},
              default=str,
              sort_keys=True,
          )
          Path("/tmp/bootstrap-before.json").write_text(snapshot)
          print("PASS: 25 demo flights and three migration records.")
          PY

          docker compose cp \
            api:/tmp/bootstrap-before.json \
            reports/bootstrap-before.json

      - name: Repeat bootstrap
        run: docker compose run --rm -T --no-deps migrate

      - name: Recreate containers while preserving the database volume
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 180

      - name: Verify data remained unchanged
        run: |
          docker compose cp \
            reports/bootstrap-before.json \
            api:/tmp/bootstrap-before.json

          docker compose exec -T api python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from database import get_connection

          before = json.loads(
              Path("/tmp/bootstrap-before.json").read_text()
          )

          with get_connection() as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT * FROM flights ORDER BY id")
                  flights = cursor.fetchall()

                  cursor.execute(
                      "SELECT name, checksum, applied_at "
                      "FROM schema_migrations ORDER BY name"
                  )
                  migrations = cursor.fetchall()

          after = json.loads(json.dumps(
              {"flights": flights, "migrations": migrations},
              default=str,
              sort_keys=True,
          ))

          assert after == before, (
              "Flight data or migration history changed after restart"
          )

          with urllib.request.urlopen(
              "http://127.0.0.1:8000/ready", timeout=5
          ) as response:
              assert response.status == 200
              assert json.load(response)["status"] == "ready"

          print("PASS: data, migration history and readiness verified.")
          PY

      - name: Prepare a legacy database without migration history
        run: |
          docker compose exec -T db \
            createdb -U flight_app flight_lab_legacy_test

          for migration in \
            sql/001_create_flights.sql \
            sql/002_add_flight_details.sql \
            sql/003_add_flight_unique_index.sql
          do
            docker compose exec -T db \
              psql -U flight_app -d flight_lab_legacy_test \
              -v ON_ERROR_STOP=1 < "$migration"
          done

          docker compose exec -T db \
            psql -U flight_app -d flight_lab_legacy_test \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO flights (
              flight_number, origin, destination,
              flight_date, carrier_code
          )
          VALUES (
              'LEGACY001', 'WAW', 'LHR',
              '2025-06-15', 'LO'
          );
          SQL

      - name: Adopt the legacy schema
        run: |
          docker compose run --rm -T --no-deps \
            -e POSTGRES_DB=flight_lab_legacy_test \
            migrate

      - name: Verify legacy data preservation
        run: |
          docker compose exec -T api python - <<'PY'
          from datetime import date
          from database import get_connection

          with get_connection("flight_lab_legacy_test") as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT * FROM flights ORDER BY id")
                  flights = cursor.fetchall()

                  assert flights == [{
                      "id": 1,
                      "flight_number": "LEGACY001",
                      "origin": "WAW",
                      "destination": "LHR",
                      "flight_date": date(2025, 6, 15),
                      "carrier_code": "LO",
                  }], "Legacy record was changed or demo data was added"

                  cursor.execute(
                      "SELECT name FROM schema_migrations ORDER BY name"
                  )
                  names = [row["name"] for row in cursor.fetchall()]

                  assert names == [
                      "001_create_flights.sql",
                      "002_add_flight_details.sql",
                      "003_add_flight_unique_index.sql",
                  ]

          print("PASS: legacy schema adopted and original data preserved.")
          PY

      - name: Collect Compose logs
        if: always()
        run: |
          mkdir -p reports
          docker compose ps -a > reports/compose-status.txt
          docker compose logs --no-color > reports/compose.log 2>&1

      - name: Upload bootstrap reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-bootstrap-results
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up temporary CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
