name: API tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flight_lab_test
          POSTGRES_USER: flight_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flight_app -d flight_lab_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: flight_lab_test
      POSTGRES_USER: flight_app
      POSTGRES_PASSWORD: ci_test_password

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test database schema
        run: |
          python - <<'PY'
          from pathlib import Path
          from database import get_connection

          schema = Path("sql/001_create_flights.sql").read_text(
              encoding="utf-8"
          )

          with get_connection("flight_lab_test") as connection:
              with connection.cursor() as cursor:
                  cursor.execute(schema)
          PY

      - name: Run tests
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: reports/junit.xml
          retention-days: 14
          if-no-files-found: warn
