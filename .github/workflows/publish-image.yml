name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSE_PROJECT_NAME: flight-publish-check
      POSTGRES_DB: flight_lab
      POSTGRES_USER: flight_app
      POSTGRES_PASSWORD: ci_publish_password
      API_PORT: "8000"
      DB_PORT: "5432"
      SEED_DEMO: "true"

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Build and start application
        run: |
          docker compose up --build --wait --wait-timeout 180

      - name: Verify application before publishing
        run: |
          docker compose exec -T api python - <<'PY'
          import json
          import urllib.request

          base_url = "http://127.0.0.1:8000"

          with urllib.request.urlopen(
              f"{base_url}/ready", timeout=5
          ) as response:
              assert response.status == 200
              assert json.load(response)["status"] == "ready"

          with urllib.request.urlopen(
              f"{base_url}/flights?limit=1", timeout=5
          ) as response:
              result = json.load(response)
              assert result["total"] == 25
              assert len(result["items"]) == 1

          with urllib.request.urlopen(
              base_url, timeout=5
          ) as response:
              assert response.status == 200
              assert "Flight Explorer" in response.read().decode()

          print("Application, database and demo data verified.")
          PY

      - name: Set image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish tested image
        run: |
          docker tag flight-api:local "$IMAGE:sha-$GITHUB_SHA"
          docker tag flight-api:local "$IMAGE:latest"

          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"

          {
            echo "## Published Docker image"
            echo
            echo "- Image: \`$IMAGE:latest\`"
            echo "- Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "- Platform: Linux AMD64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/publish-compose.log 2>&1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-image-logs
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up CI resources
        if: always()
        run: |
          docker logout ghcr.io
          docker compose down --volumes --remove-orphans
